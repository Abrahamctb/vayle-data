name: gap-snapshot

# Read-only snapshot (every 30 minutes) of Chainlink-vs-pool prices on Robinhood Chain (public RPC, no secrets).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gap-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Take the snapshot (writes gap-snapshot.json at the repo root)
        run: node script/gap-snapshot.mjs

      - name: Sanity check (fails the job, and commits nothing, if the snapshot looks wrong)
        run: |
          node - <<'EOF_CHECK'
          const fs = require("fs");
          let d;
          try {
            d = JSON.parse(fs.readFileSync("gap-snapshot.json", "utf8"));
          } catch (e) {
            console.error("gap-snapshot.json does not parse:", e.message);
            process.exit(1);
          }
          const withGap = (d.stocks || []).filter((s) => typeof s.gap_bps === "number" && Number.isFinite(s.gap_bps));
          if (withGap.length < 15) {
            console.error(`only ${withGap.length} stocks have a gap (need at least 15)`);
            process.exit(1);
          }
          const ageMin = (Date.now() - Date.parse(d.snapshot_at)) / 60000;
          if (!(ageMin >= -2 && ageMin <= 10)) {
            console.error(`snapshot_at ${d.snapshot_at} is ${ageMin.toFixed(1)} minutes old (allowed: 10)`);
            process.exit(1);
          }
          console.log(`ok: ${withGap.length} stocks, snapshot_at ${d.snapshot_at} (${ageMin.toFixed(1)} min old), block ${d.block}`);
          EOF_CHECK

      - name: Append one row to history.json (skips duplicates and short snapshots)
        run: node script/append-history.mjs

      - name: Telegram gap alerts (dry run if the secrets are not set; never fails the data commit)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node script/alert.mjs

      - name: Commit and push only if something changed (rebase and retry up to 3 times)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES="gap-snapshot.json history.json alert-state.json"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "nothing changed, nothing to commit"
            exit 0
          fi
          git add $FILES
          git commit -m "snapshot $(node -p "require('./gap-snapshot.json').snapshot_at")"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (another writer pushed first), attempt $attempt: rebasing onto origin/main"
            if git pull --rebase origin main; then
              continue   # rebased cleanly (the other writer touched other files): push again
            fi
            # a real conflict (the same data file was changed upstream, e.g. by the local fallback): rebuild from origin/main
            echo "rebase conflict: rebuilding this run's rows on top of origin/main"
            git rebase --abort || true
            cp alert-state.json /tmp/alert-state.json   # the alerts were already sent: keep their cooldown state
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/alert-state.json alert-state.json
            node script/gap-snapshot.mjs > /dev/null
            node script/append-history.mjs
            git add $FILES
            git diff --cached --quiet || git commit -m "snapshot $(node -p "require('./gap-snapshot.json').snapshot_at")"
          done
          echo "could not push after 3 attempts"
          exit 1
